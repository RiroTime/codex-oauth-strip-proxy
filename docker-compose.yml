services:
  strip-proxy:
    build: .
    image: codex-oauth-strip-proxy:0.1.0
    container_name: codex-strip-proxy
    restart: unless-stopped

    # ---------------------------------------------------------------------
    # 为什么是 host 网络
    # ---------------------------------------------------------------------
    # 上游桥地址被写在 codex-strip-proxy.js 的常量里，默认 127.0.0.1:18080。
    # 用 host 网络，容器里的 127.0.0.1 就是宿主机的 127.0.0.1 —— 桥跑在
    # 宿主机上时这是最省事、最不容易出错的方式（无需额外代理/端口映射）。
    #
    # 注意：host 网络只在 Linux 上生效。macOS / Windows 的 Docker Desktop
    # 请改用 ports 映射，并把脚本里的 UPSTREAM_HOST 改成 host.docker.internal。
    #
    # host 模式下 ports: 会被忽略（本来也不需要）。
    network_mode: host

    environment:
      # 变量从同目录的 .env 读取（compose 自动加载），缺省值见冒号后面
      STRIP_PROXY_HOST: ${STRIP_PROXY_HOST:-0.0.0.0}
      STRIP_PROXY_PORT: ${STRIP_PROXY_PORT:-18081}
